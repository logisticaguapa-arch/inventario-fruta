name: Actualizar Inventario

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-inventario
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar dependencias
        run: pip install openpyxl requests

      - name: Descargar y procesar Excel
        run: |
          python3 << 'EOF'
          import requests, openpyxl, io

          url = "https://agricolaguapa-my.sharepoint.com/:x:/g/personal/coordinador_logistico_guapa_com_co/IQDQfo1oimGITIutSnziZXTmAZuo0_tcGIcZvShC86nTMFg?download=1"
          r = requests.get(url, allow_redirects=True, timeout=30)
          print(f"Status: {r.status_code}, Tamaño: {len(r.content)} bytes")
          wb = openpyxl.load_workbook(io.BytesIO(r.content), data_only=True)

          ws_proc = wb["Proceso"]
          bin_map = {}
          for row in ws_proc.iter_rows(min_row=2, values_only=True):
              id_val  = row[0]
              bin_val = row[1]
              if id_val:
                  bin_map[str(id_val).strip()] = str(bin_val or "").strip()

          print(f"IDs en Proceso: {len(bin_map)}")

          ws_inv = wb["Inventario"]
          csv = "ID,Bin,Fecha,Calidad,Nombre,Calibre,KgDisponibles\n"
          for row in ws_inv.iter_rows(min_row=2, values_only=True):
              if not row[0]: continue
              id_val  = str(row[0]).strip()
              bin_val = bin_map.get(id_val, "")
              fecha   = str(row[1])[:10] if row[1] else ""
              calidad = str(row[2] or "")
              nombre  = str(row[3] or "").replace(",", " ")
              calibre = str(row[4] or "").replace(",", ".")
              kg      = str(row[5] or 0)
              csv += f"{id_val},{bin_val},{fecha},{calidad},{nombre},{calibre},{kg}\n"

          with open("inventario.csv", "w", encoding="utf-8") as f:
              f.write(csv)
          print(f"CSV generado: {csv.count(chr(10))-1} registros")

          def es_anulado(v):
              s = str(v or "").strip().upper()
              return s in ("SI", "SÍ", "X", "ANULADO", "ANULADA", "TRUE")

          ws_desp = wb["Despacho"]

          csv2 = "FechaDespacho,Factura,Remision,Cliente,Categoria,Calibre,KilosFinal,ReposicionKilos,Precio,KilosDescarte\n"
          n2 = 0
          fechas_vistas = []
          for row in ws_desp.iter_rows(min_row=2, values_only=True):
              id_val = row[2]
              remision_val = row[23] if len(row) > 23 else None
              if not id_val and not remision_val: continue
              anula_rm = es_anulado(row[25]) if len(row) > 25 else False
              anula_fv = es_anulado(row[26]) if len(row) > 26 else False
              if anula_rm or anula_fv: continue

              fecha_desp = str(row[1])[:10] if row[1] else ""
              if fecha_desp: fechas_vistas.append(fecha_desp)
              cliente    = str(row[0] or "").replace(",", " ").strip()
              calibre    = str(row[5] or "").replace(",", ".").strip()
              categoria  = str(row[6] or "").replace(",", " ").strip()
              kilos      = row[13] or 0
              reposicion = row[15] or 0
              precio_raw = row[22]
              precio     = "" if precio_raw in (None, "") else precio_raw
              remision   = str(row[23] or "").replace(",", " ").strip()
              factura    = str(row[24] or "").replace(",", " ").strip()
              descarte   = row[12] or 0
              csv2 += f"{fecha_desp},{factura},{remision},{cliente},{categoria},{calibre},{kilos},{reposicion},{precio},{descarte}\n"
              n2 += 1

          with open("despacho.csv", "w", encoding="utf-8") as f:
              f.write(csv2)
          print(f"despacho.csv generado: {n2} registros")
          if fechas_vistas:
              print(f"Rango de fechas despacho: {min(fechas_vistas)} a {max(fechas_vistas)}")
          EOF

      - name: Subir CSV a GitHub
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add inventario.csv despacho.csv
          git diff --staged --quiet || git commit -m "Inventario actualizado $(date +'%Y-%m-%d %H:%M')"
          git push origin main --force

      - name: Volver a dispararse pronto (cadena independiente del Excel)
        if: success() || failure()
        run: |
          sleep 60
          for i in 1 2 3 4 5; do
            codigo=$(curl -s -o /tmp/respuesta.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"ref":"main"}' \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/actualizar.yml/dispatches)
            echo "Intento $i -> codigo HTTP: $codigo"
            cat /tmp/respuesta.txt
            if [ "$codigo" = "204" ]; then exit 0; fi
            sleep 15
          done
