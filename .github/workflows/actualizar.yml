name: Actualizar Inventario

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-inventario
  # false: si llega un disparo nuevo mientras otro esta corriendo, ESPERA en cola
  # en vez de matar al que esta corriendo. Con cancel-in-progress:true, una corrida
  # nueva podia matar a la anterior justo mientras esperaba que GitHub Pages
  # terminara de desplegar, dejando ese despliegue abandonado a medias y
  # atascando las corridas siguientes detras de el.
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # Limite duro: si algo se cuelga (por ejemplo esperando a que GitHub Pages
    # termine de desplegar), la corrida se cae sola a los 10 minutos en vez de
    # quedarse "corriendo" indefinidamente y bloquear la fila para las que siguen.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Instalar dependencias
        run: pip install openpyxl requests

      - name: Descargar y procesar Excel
        run: |
          python3 << 'EOF'
          import warnings, requests, openpyxl, io
          warnings.filterwarnings("ignore", category=UserWarning, module="openpyxl")

          url = "https://agricolaguapa-my.sharepoint.com/:x:/g/personal/coordinador_logistico_guapa_com_co/IQDQfo1oimGITIutSnziZXTmAZuo0_tcGIcZvShC86nTMFg?download=1"
          r = requests.get(url, allow_redirects=True, timeout=30)
          print(f"Status: {r.status_code}, Tamaño: {len(r.content)} bytes")
          # read_only=True: no carga estilos, formatos condicionales ni validaciones de datos
          # (todo eso el proceso no lo necesita, solo los valores de las celdas) -- con
          # Proceso/Despacho creciendo a decenas de miles de filas, esto es lo que mas
          # tiempo ahorra frente a cargar el libro "completo".
          wb = openpyxl.load_workbook(io.BytesIO(r.content), data_only=True, read_only=True)

          # Leer col B (Bin) de Proceso para cruzar con ID
          ws_proc = wb["Proceso"]
          bin_map = {}
          for row in ws_proc.iter_rows(min_row=2, values_only=True):
              id_val  = row[0]   # Col A - ID
              bin_val = row[1]   # Col B - Bin
              if id_val:
                  bin_map[str(id_val).strip()] = str(bin_val or "").strip()

          print(f"IDs en Proceso: {len(bin_map)}")

          # Leer hoja Inventario
          ws_inv = wb["Inventario"]
          csv = "ID,Bin,Fecha,Calidad,Nombre,Calibre,KgDisponibles\n"
          for row in ws_inv.iter_rows(min_row=2, values_only=True):
              if not row[0]: continue
              id_val  = str(row[0]).strip()
              bin_val = bin_map.get(id_val, "")
              fecha   = str(row[1])[:10] if row[1] else ""
              calidad = str(row[2] or "")
              nombre  = str(row[3] or "").replace(",", " ")
              calibre = "" if row[4] is None else str(row[4]).replace(",", ".")
              kg      = str(row[5] or 0)
              csv += f"{id_val},{bin_val},{fecha},{calidad},{nombre},{calibre},{kg}\n"

          with open("inventario.csv", "w", encoding="utf-8") as f:
              f.write(csv)
          print(f"CSV generado: {csv.count(chr(10))-1} registros")

          # ── Hoja Despacho -> despacho.csv (para la vista Facturacion) ──
          def es_anulado(v):
              s = str(v or "").strip().upper()
              return s in ("SI", "SÍ", "X", "ANULADO", "ANULADA", "TRUE")

          ws_desp = wb["Despacho"]

          csv2 = "FechaDespacho,Factura,Remision,Cliente,Categoria,Calibre,KilosFinal,ReposicionKilos,Precio,KilosDescarte\n"
          n2 = 0
          fechas_vistas = []
          for row in ws_desp.iter_rows(min_row=2, values_only=True):
              id_val = row[2]        # Col C - ID (vacio en filas que son solo una reposicion adicional)
              remision_val = row[23] if len(row) > 23 else None  # Col X - Remision
              if not id_val and not remision_val: continue  # fila totalmente vacia (ni ID ni Remision)
              anula_rm = es_anulado(row[25]) if len(row) > 25 else False
              anula_fv = es_anulado(row[26]) if len(row) > 26 else False
              if anula_rm or anula_fv: continue  # excluir remisiones/facturas anuladas

              fecha_desp = str(row[1])[:10] if row[1] else ""
              if fecha_desp: fechas_vistas.append(fecha_desp)
              cliente    = str(row[0] or "").replace(",", " ").strip()
              calibre    = ("" if row[5] is None else str(row[5])).replace(",", ".").strip()
              categoria  = str(row[6] or "").replace(",", " ").strip()
              kilos      = row[13] or 0
              reposicion = row[15] or 0
              precio_raw = row[22]
              precio     = "" if precio_raw in (None, "") else precio_raw  # en blanco = en blanco (para que el promedio lo excluya, igual que Excel)
              remision   = str(row[23] or "").replace(",", " ").strip()
              factura    = str(row[24] or "").replace(",", " ").strip()
              descarte   = row[12] or 0   # Col M - Kilos de descarte
              csv2 += f"{fecha_desp},{factura},{remision},{cliente},{categoria},{calibre},{kilos},{reposicion},{precio},{descarte}\n"
              n2 += 1

          with open("despacho.csv", "w", encoding="utf-8") as f:
              f.write(csv2)
          print(f"despacho.csv generado: {n2} registros")
          if fechas_vistas:
              print(f"Rango de fechas despacho: {min(fechas_vistas)} a {max(fechas_vistas)}")
          wb.close()
          EOF

      - name: Subir CSV a GitHub
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add inventario.csv despacho.csv
          git diff --staged --quiet || git commit -m "Inventario actualizado $(date +'%Y-%m-%d %H:%M')"
          git push origin main --force

      - name: Preparar sitio para Pages
        run: |
          mkdir -p _site
          cp index.html _site/
          cp validador-cargue.html _site/ 2>/dev/null || true
          cp inventario.csv _site/
          cp despacho.csv _site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
